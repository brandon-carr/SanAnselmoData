name: Geocode San Anselmo addresses

on:
  workflow_dispatch:

jobs:
  geocode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GEOCODER_ENABLED: "true"
      GEOCODER_PROVIDER: "nominatim"
      GEOCODER_BASE_URL: https://nominatim.openstreetmap.org/search
      GEOCODER_USER_AGENT: SanAnselmoPermitScrape/1.0 (github actions geocoding workflow)
      GEOCODER_COUNTRY_CODES: us
      GEOCODER_TIMEOUT_SECONDS: 30
      GEOCODER_MIN_INTERVAL_SECONDS: 1.0
      GEOCODE_BATCH_SIZE: 10
      GEOCODE_MAX_ATTEMPTS: 3

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run address geocode job
        run: |
          python scripts/geocode_permits.py

      - name: Upload geocode artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocode-data
          path: |
            data/current_permits.json
            data/addresses.json
            data/address_history.json
            data/geocode_cache.json
          if-no-files-found: ignore

      - name: Commit updated geocode data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            data/current_permits.json \
            data/addresses.json \
            data/address_history.json \
            data/geocode_cache.json
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          git diff --cached --quiet || git commit -m "Geocode permit addresses"
          git push
