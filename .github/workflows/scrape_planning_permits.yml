name: Scrape San Anselmo planning permits

on:
  workflow_dispatch:
  schedule:
    # 6:35 AM PDT (13:35 UTC)
    - cron: "35 13 * * *"

jobs:
  scrape_planning:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ETRAKIT_USERNAME: ${{ secrets.ETRAKIT_USERNAME }}
      ETRAKIT_PASSWORD: ${{ secrets.ETRAKIT_PASSWORD }}

      ETRAKIT_DEBUG: "true"
      ETRAKIT_DEBUG_DIR: data/debug

      ETRAKIT_BASE_URL: https://sanan-trk.aspgov.com/eTRAKiT/
      ETRAKIT_LOGIN_URL: https://sanan-trk.aspgov.com/eTRAKiT/

      ETRAKIT_USERNAME_FIELD: ctl00$MainContent$txtUserName
      ETRAKIT_PASSWORD_FIELD: ctl00$MainContent$txtPassword
      ETRAKIT_LOGIN_BUTTON_FIELD: ctl00$MainContent$btnLogin

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Validate secrets
        run: |
          if [ -z "$ETRAKIT_USERNAME" ]; then echo "Missing username"; exit 1; fi
          if [ -z "$ETRAKIT_PASSWORD" ]; then echo "Missing password"; exit 1; fi

      - name: Run planning permit scrape
        run: |
          python scripts/scrape_planning_permits.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etrakit-planning-debug
          path: |
            data/debug/**
            data/*.json
          if-no-files-found: ignore

      - name: Commit updated planning data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            data/planning_permits.json \
            data/planning_permit_history.json \
            data/planning_scrape_state.json \
            data/all_permits_view.json \
            data/addresses.json \
            data/address_history.json
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          git diff --cached --quiet || git commit -m "Scrape planning permits"
          git push
