name: Scrape San Anselmo violations

on:
  workflow_dispatch:
  schedule:
    # 6:40 AM PDT (13:40 UTC)
    - cron: "40 13 * * *"

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  scrape_violations:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ETRAKIT_USERNAME: ${{ secrets.ETRAKIT_USERNAME }}
      ETRAKIT_PASSWORD: ${{ secrets.ETRAKIT_PASSWORD }}

      ETRAKIT_DEBUG: "true"
      ETRAKIT_DEBUG_DIR: data/debug

      ETRAKIT_BASE_URL: https://sanan-trk.aspgov.com/eTRAKiT/
      ETRAKIT_LOGIN_URL: https://sanan-trk.aspgov.com/eTRAKiT/

      ETRAKIT_USERNAME_FIELD: ctl00$MainContent$txtUserName
      ETRAKIT_PASSWORD_FIELD: ctl00$MainContent$txtPassword
      ETRAKIT_LOGIN_BUTTON_FIELD: ctl00$MainContent$btnLogin

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Validate secrets
        run: |
          if [ -z "$ETRAKIT_USERNAME" ]; then echo "Missing username"; exit 1; fi
          if [ -z "$ETRAKIT_PASSWORD" ]; then echo "Missing password"; exit 1; fi

      - name: Run violations scrape
        run: |
          python scripts/scrape_violations.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etrakit-violations-debug
          path: |
            data/debug/**
            data/*.json
          if-no-files-found: ignore

      - name: Commit updated violations data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            data/violations_permits.json \
            data/violations_permit_history.json \
            data/violations_scrape_state.json \
            data/all_permits_view.json \
            data/permits_view.json \
            data/violations_view.json \
            data/inspections_view.json \
            data/addresses.json \
            data/address_history.json \
            web/data/violations_permit_history.json \
            web/data/all_permits_view.json \
            web/data/permits_view.json \
            web/data/violations_view.json \
            web/data/inspections_view.json \
            web/data/addresses.json \
            web/data/site_config.json
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No violation changes to commit"
            exit 0
          fi

          git commit -m "Scrape violations"

          for attempt in 1 2 3
          do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi

            sleep 5
          done
