<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>San Anselmo Records Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root { --border:#d5d2c8; --panel:#fffdf7; --panel-alt:#f6f0e1; --bg:linear-gradient(180deg,#f3eee0 0%,#ebe4d2 100%); --text:#2f2518; --muted:#756654; --accent:#7b4b2a; --accent-soft:#d7b893; --shadow:0 10px 30px rgba(69,43,18,.1); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Georgia,"Times New Roman",serif; color:var(--text); background:var(--bg); }
    .app { display:grid; grid-template-columns:340px 1fr; min-height:100vh; }
    .app.cards-expanded { grid-template-columns:400px 1fr; }
    .sidebar { background:rgba(255,253,247,.96); border-right:1px solid var(--border); display:flex; flex-direction:column; min-width:0; }
    .sidebar-header,.tabs,.filters-shell,.summary { border-bottom:1px solid var(--border); }
    .sidebar-header { padding:18px 18px 16px; background:radial-gradient(circle at top right,rgba(215,184,147,.55),transparent 48%),linear-gradient(135deg,rgba(255,253,247,.98),rgba(246,240,225,.92)); }
    .sidebar-header h1 { margin:0 0 6px; font-size:26px; line-height:1.1; }
    .sidebar-header p,.summary,.meta-line,.empty-state,.map-attribution-banner { color:var(--muted); }
    .sidebar-header p,.summary,.meta-line { font-size:13px; line-height:1.45; }
    .tabs { display:flex; gap:0; padding:12px 14px 0; background:linear-gradient(180deg,rgba(246,240,225,.9),rgba(255,253,247,.95)); }
    .tab-button { border:1px solid var(--border); border-bottom:none; background:rgba(238,229,210,.85); color:var(--muted); border-radius:14px 14px 0 0; padding:12px 16px 11px; font-size:14px; font-weight:700; cursor:pointer; transition:.15s ease; margin-right:6px; position:relative; top:1px; }
    .tab-button.active { background:var(--panel); color:var(--text); box-shadow:none; z-index:2; }
    .filters-shell { background:var(--panel); padding:16px; }
    .filters-panel { display:none; gap:10px; }
    .filters-panel.active { display:grid; }
    .field { display:grid; gap:5px; }
    .field label,.field legend { font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin:0; padding:0; }
    .field input,.field select,.field button { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#fff; color:var(--text); font-size:14px; font-family:inherit; }
    .field button { background:var(--panel-alt); font-weight:700; cursor:pointer; }
    .field-group { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .checkbox-group { border:1px solid var(--border); border-radius:12px; background:#fff; padding:10px 12px; display:grid; gap:8px; }
    .checkbox-option { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text); }
    .checkbox-option input { width:auto; margin:0; }
    .summary { padding:12px 16px; background:var(--panel); }
    .results { padding:10px; overflow:auto; flex:1; background:linear-gradient(180deg,rgba(255,253,247,.72),rgba(246,240,225,.72)); }
    .results.hidden { display:none; }
    .results-toggle { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); }
    .results-toggle label { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); cursor:pointer; }
    .results-toggle input { width:auto; margin:0; }
    .record-card { background:rgba(255,255,255,.92); border:1px solid var(--border); border-radius:14px; padding:13px; box-shadow:var(--shadow); margin-bottom:10px; transition:transform .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease; }
    .record-card.is-mappable { cursor:pointer; }
    .record-card.is-mappable:hover { transform:translateY(-1px); border-color:var(--accent-soft); background:#fff; }
    .record-card.is-focused { border-color:var(--accent); background:#fffaf2; box-shadow:0 0 0 2px rgba(123,75,42,.12),var(--shadow); }
    .record-card h2 { margin:0 0 7px; font-size:16px; line-height:1.25; }
    .badge-line { display:inline-flex; align-items:center; gap:6px; margin-bottom:8px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); background:rgba(215,184,147,.28); border-radius:999px; padding:4px 8px; }
    .empty-state { padding:18px 10px; font-size:14px; }
    .notes-modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(47,37,24,.35); z-index:2000; padding:20px; }
    .notes-modal.open { display:flex; }
    .notes-dialog { width:min(520px, 100%); max-height:min(70vh, 640px); overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:16px; }
    .notes-dialog h2 { margin:0 0 10px; font-size:18px; }
    .notes-dialog pre { margin:0; white-space:pre-wrap; word-break:break-word; font:inherit; color:var(--text); }
    .notes-close { margin-top:12px; padding:8px 12px; border:1px solid var(--border); border-radius:10px; background:var(--panel-alt); color:var(--text); font:inherit; cursor:pointer; }
    .map-shell { position:relative; min-width:0; }
    #map { width:100%; height:100%; }
    .map-attribution-banner { position:absolute; right:12px; bottom:12px; z-index:500; background:rgba(255,253,247,.92); border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:12px; line-height:1.35; box-shadow:var(--shadow); }
    .map-attribution-banner a { color:inherit; font-weight:700; }
    @media (max-width:1080px) { .app { grid-template-columns:1fr; grid-template-rows:auto 52vh; } .sidebar { border-right:none; border-bottom:1px solid var(--border); } }
    @media (max-width:700px) { .tabs,.field-group { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>San Anselmo Records</h1>
        <p>Search permits, violations, and inspections in separate tabs. The map only shows the active tab's matching results.</p>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab-button active" data-tab="permits" type="button">Permits</button>
        <button class="tab-button" data-tab="violations" type="button">Violations</button>
        <button class="tab-button" data-tab="inspections" type="button">Inspections</button>
      </div>
      <div class="filters-shell">
        <div class="filters-panel active" data-tab-panel="permits">
          <div class="field"><label for="permitsKeyword">Keyword</label><input id="permitsKeyword" type="text" placeholder="Address, permit number, description" /></div>
          <fieldset class="field">
            <legend>Permit Record Types</legend>
            <div class="checkbox-group">
              <label class="checkbox-option"><input id="permitsBuilding" type="checkbox" checked />Building Permits</label>
              <label class="checkbox-option"><input id="permitsPlanning" type="checkbox" checked />Planning Permits</label>
            </div>
          </fieldset>
          <div class="field"><label for="permitsType">Permit Type</label><select id="permitsType"><option value="">All permit types</option></select></div>
          <div class="field"><label for="permitsStatus">Status</label><select id="permitsStatus"><option value="">All statuses</option></select></div>
          <label class="checkbox-option"><input id="permitsShowInactive" type="checkbox" />Show Non-Active Records</label>
          <div class="field-group">
            <div class="field"><label for="permitsStartDate">Start Date</label><input id="permitsStartDate" type="date" /></div>
            <div class="field"><label for="permitsEndDate">End Date</label><input id="permitsEndDate" type="date" /></div>
          </div>
          <div class="field"><button id="permitsReset" type="button">Reset Permit Filters</button></div>
        </div>
        <div class="filters-panel" data-tab-panel="violations">
          <div class="field"><label for="violationsKeyword">Keyword</label><input id="violationsKeyword" type="text" placeholder="Address, case number, notes" /></div>
          <div class="field"><label for="violationsType">Violation Type</label><select id="violationsType"><option value="">All violation types</option></select></div>
          <div class="field"><label for="violationsStatus">Status</label><select id="violationsStatus"><option value="">All statuses</option></select></div>
          <label class="checkbox-option"><input id="violationsShowInactive" type="checkbox" />Show Non-Active Records</label>
          <div class="field-group">
            <div class="field"><label for="violationsStartDate">Start Date</label><input id="violationsStartDate" type="date" /></div>
            <div class="field"><label for="violationsEndDate">End Date</label><input id="violationsEndDate" type="date" /></div>
          </div>
          <div class="field"><button id="violationsReset" type="button">Reset Violation Filters</button></div>
        </div>
        <div class="filters-panel" data-tab-panel="inspections">
          <div class="field"><label for="inspectionsKeyword">Keyword</label><input id="inspectionsKeyword" type="text" placeholder="Address, permit number, inspector" /></div>
          <div class="field"><label for="inspectionsType">Inspection Type</label><select id="inspectionsType"><option value="">All inspection types</option></select></div>
          <div class="field"><label for="inspectionsResult">Result</label><select id="inspectionsResult"><option value="">All results</option></select></div>
          <label class="checkbox-option"><input id="inspectionsTodayOnly" type="checkbox" checked />Only Today's Inspections</label>
          <div class="field-group">
            <div class="field"><label for="inspectionsStartDate">Start Date</label><input id="inspectionsStartDate" type="date" /></div>
            <div class="field"><label for="inspectionsEndDate">End Date</label><input id="inspectionsEndDate" type="date" /></div>
          </div>
          <div class="field"><button id="inspectionsReset" type="button">Reset Inspection Filters</button></div>
        </div>
      </div>
      <div class="results-toggle">
        <label for="showResults">
          <input id="showResults" type="checkbox" />
          Show Records
        </label>
      </div>
      <div class="summary" id="summary">Loading records...</div>
      <div class="results hidden" id="results"></div>
    </aside>
    <main class="map-shell">
      <div id="map"></div>
      <div class="map-attribution-banner">Map data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>.</div>
    </main>
  </div>
  <div class="notes-modal" id="notesModal" role="dialog" aria-modal="true" aria-labelledby="notesModalTitle">
    <div class="notes-dialog">
      <h2 id="notesModalTitle">Inspection Notes</h2>
      <pre id="notesModalBody"></pre>
      <button class="notes-close" id="notesModalClose" type="button">Close</button>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const TAB_CONFIG = {
      permits: { label: "Permits", url: "../data/permits_view.json" },
      violations: { label: "Violations", url: "../data/violations_view.json" },
      inspections: { label: "Inspections", url: "../data/inspections_view.json" }
    };
    const SITE_CONFIG_URL = "../data/site_config.json";
    const CACHE_BUST = `ts=${Date.now()}`;
    const BUILDING_MARKER_URL = `../assets/building-marker.png?${CACHE_BUST}`;
    const PLANNING_MARKER_URL = `../assets/planning-marker.png?${CACHE_BUST}`;
    const INSPECTION_MARKER_URL = `../assets/inspection-marker.png?${CACHE_BUST}`;
    const VIOLATION_MARKER_URL = `../assets/violation-marker.png?${CACHE_BUST}`;
    const DEFAULT_CENTER = [37.9746, -122.561];
    const DEFAULT_ZOOM = 13;
    const state = { activeTab: "permits", datasets: { permits: null, violations: null, inspections: null }, filteredRecords: [], markersByRecord: new Map(), cardsByRecord: new Map(), inactiveStatuses: [], linkedFiltersApplied: false };
    const appEl = document.querySelector(".app");
    const tabsEl = document.getElementById("tabs");
    const resultsEl = document.getElementById("results");
    const summaryEl = document.getElementById("summary");
    const showResultsEl = document.getElementById("showResults");
    const notesModalEl = document.getElementById("notesModal");
    const notesModalTitleEl = document.getElementById("notesModalTitle");
    const notesModalBodyEl = document.getElementById("notesModalBody");
    const notesModalCloseEl = document.getElementById("notesModalClose");
    const map = L.map("map").setView(DEFAULT_CENTER, DEFAULT_ZOOM);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors' }).addTo(map);
    const markersLayer = L.markerClusterGroup();
    map.addLayer(markersLayer);
    function createMarkerIcon(iconUrl, className) {
      return L.icon({
        iconUrl,
        iconSize: [42, 42],
        iconAnchor: [21, 41],
        popupAnchor: [0, -34],
        className
      });
    }
    const markerIcons = {
      building: createMarkerIcon(BUILDING_MARKER_URL, "building-permit-marker"),
      planning: createMarkerIcon(PLANNING_MARKER_URL, "planning-permit-marker"),
      inspection: createMarkerIcon(INSPECTION_MARKER_URL, "inspection-marker"),
      violations: createMarkerIcon(VIOLATION_MARKER_URL, "violation-marker")
    };
    const filterEls = {
      permits: { keyword: document.getElementById("permitsKeyword"), building: document.getElementById("permitsBuilding"), planning: document.getElementById("permitsPlanning"), permitType: document.getElementById("permitsType"), status: document.getElementById("permitsStatus"), showInactive: document.getElementById("permitsShowInactive"), startDate: document.getElementById("permitsStartDate"), endDate: document.getElementById("permitsEndDate"), reset: document.getElementById("permitsReset") },
      violations: { keyword: document.getElementById("violationsKeyword"), permitType: document.getElementById("violationsType"), status: document.getElementById("violationsStatus"), showInactive: document.getElementById("violationsShowInactive"), startDate: document.getElementById("violationsStartDate"), endDate: document.getElementById("violationsEndDate"), reset: document.getElementById("violationsReset") },
      inspections: { keyword: document.getElementById("inspectionsKeyword"), permitType: document.getElementById("inspectionsType"), result: document.getElementById("inspectionsResult"), todayOnly: document.getElementById("inspectionsTodayOnly"), startDate: document.getElementById("inspectionsStartDate"), endDate: document.getElementById("inspectionsEndDate"), reset: document.getElementById("inspectionsReset") }
    };
    const escapeHtml = (value) => String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
    const asArray = (data) => Array.isArray(data) ? data : [];
    const normalizeStatusValue = (value) => String(value || "").trim().toLowerCase();
    const isInactiveStatus = (value) => state.inactiveStatuses.includes(normalizeStatusValue(value));
    function parseUsDate(value) {
      const match = String(value || "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!match) return null;
      return new Date(Number(match[3]), Number(match[1]) - 1, Number(match[2]));
    }
    function toIsoDateString(date) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "";
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }
    function isTodayInspectionRecord(record) {
      const todayIso = toIsoDateString(new Date());
      return toIsoDateString(parseUsDate(record.scheduled_date)) === todayIso || toIsoDateString(parseUsDate(record.completed_date)) === todayIso;
    }
    function normalizeRecord(raw) {
      const latRaw = String(raw.lat ?? raw.latitude ?? "").trim();
      const lngRaw = String(raw.lng ?? raw.lon ?? raw.longitude ?? "").trim();
      const lat = latRaw === "" ? NaN : Number(latRaw);
      const lng = lngRaw === "" ? NaN : Number(lngRaw);
      const extra = raw && typeof raw.extra === "object" && raw.extra && !Array.isArray(raw.extra) ? raw.extra : {};
      const recordType = raw.record_type || "";
      const rawFields = { ...Object.fromEntries(Object.entries(raw || {}).filter(([key]) => key !== "extra")), ...extra, record_type: recordType };
      return {
        record_id: raw.record_id || `${recordType}:${raw.inspection_record_id || raw.permit_number || ""}`,
        record_type: recordType,
        permit_number: raw.permit_number || "",
        parent_permit_number: raw.parent_permit_number || "",
        status: raw.status || "",
        permit_type: raw.permit_type || raw.type || "",
        subtype: raw.subtype || "",
        short_description: raw.short_description || "",
        address: raw.address || "",
        city_state_zip: raw.city_state_zip || "",
        apn: raw.apn || "",
        applied_date: raw.applied_date || "",
        approved_date: raw.approved_date || "",
        issued_date: raw.issued_date || "",
        finaled_date: raw.finaled_date || "",
        expiration_date: raw.expiration_date || "",
        opened: raw.opened || extra.opened || "",
        closed: raw.closed || extra.closed || "",
        last_action: raw.last_action || extra.last_action || "",
        follow_up: raw.follow_up || extra.follow_up || "",
        inspection_record_id: raw.inspection_record_id || "",
        inspection_type: raw.inspection_type || "",
        result: raw.result || "",
        scheduled_date: raw.scheduled_date || "",
        scheduled_time: raw.scheduled_time || "",
        completed_date: raw.completed_date || "",
        completed_time: raw.completed_time || "",
        inspector: raw.inspector || "",
        remarks: raw.remarks || "",
        notes: raw.notes || "",
        source_url: raw.source_url || "",
        lat: Number.isFinite(lat) ? lat : null,
        lng: Number.isFinite(lng) ? lng : null,
        raw_fields: rawFields
      };
    }
    function formatFieldLabel(key) {
      if (key === "record_type") return "Record Type";
      return String(key || "").replaceAll("_", " ").replace(/\b\w/g, (m) => m.toUpperCase());
    }
    function getRecordTypeLabel(recordType) {
      if (recordType === "building") return "Building Permit";
      if (recordType === "planning") return "Planning Permit";
      if (recordType === "violations") return "Violation";
      if (recordType === "inspection") return "Inspection";
      return formatFieldLabel(recordType);
    }
    function formatFieldValue(value, key = "") {
      if (key === "record_type") return getRecordTypeLabel(String(value || "").trim().toLowerCase());
      if (value == null) return "";
      if (typeof value === "object") return Array.isArray(value) ? (value.length ? JSON.stringify(value) : "") : (Object.keys(value).length ? JSON.stringify(value) : "");
      return String(value).trim();
    }
    function buildInspectionTableRows(inspections) {
      const items = Array.isArray(inspections) ? inspections : [];
      if (!items.length) return "";
      const rows = items.map((inspection) => {
        const type = escapeHtml(inspection.inspection_type || "");
        const scheduled = escapeHtml([inspection.scheduled_date, inspection.scheduled_time].filter(Boolean).join(" "));
        const completed = escapeHtml([inspection.completed_date, inspection.completed_time].filter(Boolean).join(" "));
        const result = escapeHtml(inspection.result || "");
        const inspector = escapeHtml(inspection.inspector || "");
        const noteText = String(inspection.notes || inspection.remarks || "").trim();
        const noteLink = noteText
          ? `<button type="button" onclick='openNotesPopup(${JSON.stringify(inspection.inspection_type || "Inspection Notes")}, ${JSON.stringify(noteText)})' style="padding:0; border:none; background:none; color:#7b4b2a; font:inherit; text-decoration:underline; cursor:pointer;">View notes</button>`
          : "<span style=\"color:#756654;\">-</span>";
        return `<tr><td style="padding:6px 8px 6px 0; vertical-align:top; border-bottom:1px solid #eee;">${type}</td><td style="padding:6px 8px; vertical-align:top; border-bottom:1px solid #eee;">${scheduled}</td><td style="padding:6px 8px; vertical-align:top; border-bottom:1px solid #eee;">${completed}</td><td style="padding:6px 8px; vertical-align:top; border-bottom:1px solid #eee;">${result}</td><td style="padding:6px 8px; vertical-align:top; border-bottom:1px solid #eee;">${inspector || '<span style="color:#756654;">-</span>'}</td><td style="padding:6px 0 6px 8px; vertical-align:top; border-bottom:1px solid #eee;">${noteLink}</td></tr>`;
      }).join("");
      return `<div style="margin-top:8px;"><strong>Inspections:</strong><div style="margin-top:6px; overflow:auto;"><table style="width:100%; min-width:780px; border-collapse:collapse; font-size:11px; line-height:1.25; table-layout:fixed;"><thead><tr><th style="width:20%; padding:0 8px 4px 0; text-align:left; border-bottom:1px solid #ddd;">Type</th><th style="width:18%; padding:0 8px 4px 8px; text-align:left; border-bottom:1px solid #ddd;">Scheduled</th><th style="width:18%; padding:0 8px 4px 8px; text-align:left; border-bottom:1px solid #ddd;">Completed</th><th style="width:10%; padding:0 8px 4px 8px; text-align:left; border-bottom:1px solid #ddd;">Result</th><th style="width:22%; padding:0 8px 4px 8px; text-align:left; border-bottom:1px solid #ddd;">Inspector</th><th style="width:12%; padding:0 0 4px 8px; text-align:left; border-bottom:1px solid #ddd;">Notes</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }
    function buildPreferredFieldRows(record) {
      const preferredOrder = ["permit_number", "parent_permit_number", "record_type", "address", "city_state_zip", "permit_type", "subtype", "status", "inspection_type", "result", "scheduled_date", "scheduled_time", "completed_date", "completed_time", "inspector", "remarks", "notes", "applied_date", "approved_date", "issued_date", "finaled_date", "expiration_date", "opened", "closed", "last_action", "follow_up", "short_description", "apn", "lot_size_sf", "property_type", "last_changed_at", "last_seen_at"];
      const rows = [];
      for (const key of preferredOrder) {
        if (!(key in record.raw_fields)) continue;
        const value = formatFieldValue(record.raw_fields[key], key);
        if (!value) continue;
        rows.push(`<div><strong>${escapeHtml(formatFieldLabel(key))}:</strong> ${escapeHtml(value)}</div>`);
      }
      if (record.record_type !== "inspection") {
        const inspectionsTable = buildInspectionTableRows(record.raw_fields.inspections);
        if (inspectionsTable) rows.push(inspectionsTable);
      }
      return rows.join("");
    }
    function buildAllFieldRows(record) {
      const preferredRows = buildPreferredFieldRows(record);
      if (preferredRows) return preferredRows;
      const preferredOrder = ["permit_number", "parent_permit_number", "record_type", "address", "city_state_zip", "permit_type", "inspection_type", "subtype", "status", "result", "scheduled_date", "scheduled_time", "completed_date", "completed_time", "inspector", "remarks", "notes", "applied_date", "approved_date", "issued_date", "finaled_date", "expiration_date", "opened", "closed", "last_action", "follow_up", "short_description", "apn", "lot_size_sf", "property_type", "last_changed_at", "last_seen_at"];
      const seen = new Set();
      const keys = [];

        summaryEl.textContent = "Failed to load site data.";
        resultsEl.innerHTML = `<div class="empty-state">${escapeHtml(error?.message || "Unknown error")}</div>`;
      }
    })();
  </script>
</body>
</html>
